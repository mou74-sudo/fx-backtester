[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-backtester"
version = "1.0.0"
description = "Lean deterministic FX backtester scaffold for EUR/USD research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "streamlit>=1.30",
  "plotly>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
reel-generator = [
  "anthropic>=0.40",
  "requests>=2.31",
  "pytrends>=4.9",
  "pyyaml>=6.0",
]

[project.scripts]
fx-backtester = "fx_backtester.cli:main"
reel-gen = "reel_generator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

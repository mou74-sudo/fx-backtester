name: auto-backtest

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  push:
    branches:
      - main
      - claude/fix-fx-backtester-jmIpB
  workflow_dispatch:         # run manually from GitHub Actions tab

permissions:
  contents: write            # needed to commit results back

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run full pipeline (fetch → backtest → walk-forward → scan-levels)
        run: python scripts/run_pipeline.py 180

      - name: Commit results back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "auto: refresh backtest results $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
